name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest .
      - name: Test suite
        run: python -m pytest tests -q
      - name: Budget gate exits 0 under budget
        run: ctx-yield scan tests/fixtures/fake-project --budget 999999
      - name: Budget gate exits 1 over budget
        run: |
          if ctx-yield scan tests/fixtures/fake-project --budget 1; then
            echo "expected non-zero exit" && exit 1
          else
            echo "over-budget correctly exited non-zero"
          fi
